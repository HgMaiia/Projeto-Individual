<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <title>Além das Quatro Linhas | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon1.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body class="pagina-cadastro">
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <h1 class="titulo">Além das Quatro Linhas</h1>
      <ul class="navbar">
  <li><a href="index.html#inicio">Início</a></li>
  <li><a href="index.html#sobre">Sobre o projeto</a></li>
  <li><a href="dashboard.html">Dashboard</a></li>
  <li><a href="login.html">Login</a></li>
  <li class="agora"><a href="#">Cadastro</a></li>
</ul>
    </div>
  </div>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
        
          <div class="campo">
             <span>CPF:</span>
          <input id="cpf_input" type="text" placeholder="Insira aqui CPF" onkeyup="validarCpf()"/>
           <span id="validacao_cpf"></span>
          </div>
          
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" onkeyup="validarNome()">
            <span id="validacao_nome"></span>
          </div>

          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" onkeyup="validarEmail()">
            <span id="validacao_email"></span>
          </div>

          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="********" onkeyup="validarSenha(); validarConfirmacaoSenha()">
            <span id="validacao_senha"></span>
          </div>

          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="********" onkeyup="validarConfirmacaoSenha()">
            <span id="validacao_confirmacao"></span>
          </div>

          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <!--footer inicio-->
   <div class="footer">
      <div class="container">
       <h4>Além das Quatro Linhas • Projeto individual</h4>
      </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>
function cadastrar() {

    var nomeVar = nome_input.value;
    var cpfVar = cpf_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
        nomeVar == "" ||
        cpfVar == "" ||
        emailVar == "" ||
        senhaVar == "" ||
        confirmacaoSenhaVar == ""
    ) {

        cardErro.style.display = "block";
        cardErro.classList.remove("mensagem_sucesso");
        mensagem_erro.innerHTML = "Preencha todos os campos!";

        return false;
    }

    if (
        validarCpf() == false ||
        validarNome() == false ||
        validarEmail() == false ||
        validarSenha() == false ||
        validarConfirmacaoSenha() == false
    ) {

        return false;
    }

    aguardar();

    fetch("/usuarios/cadastrar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            nomeServer: nomeVar,
            cpfServer: cpfVar,
            emailServer: emailVar,
            senhaServer: senhaVar

        })

    })

    .then(function (resposta) {

        if (resposta.ok) {

            cardErro.style.display = "block";
            cardErro.classList.add("mensagem_sucesso");

            mensagem_erro.innerHTML = "Cadastro concluído!";

            finalizarAguardar();

            setTimeout(function () {
                window.location = "login.html";
            }, 3000);

        } else {

            resposta.text().then(function (texto) {

                cardErro.style.display = "block";
                cardErro.classList.remove("mensagem_sucesso");

                mensagem_erro.innerHTML = texto;

                finalizarAguardar();

            });

        }

    })

    .catch(function (erro) {

        console.log(erro);

        cardErro.style.display = "block";
        cardErro.classList.remove("mensagem_sucesso");

        mensagem_erro.innerHTML = "Erro ao conectar com o servidor!";

        finalizarAguardar();

    });

    return false;
}  

function sumirMensagem() {
    cardErro.style.display = "none";
  }

  function validarCpf() {
    var cpf = cpf_input.value;

    if (cpf.length != 11 || isNaN(cpf)) {
        validacao_cpf.innerHTML = "CPF deve possuir 11 números";
        return false;
    } else {
        validacao_cpf.innerHTML = "CPF válido!";
        return true;
    }
}

function validarNome() {
    var nome = nome_input.value;

    if (nome.length < 4) {
        validacao_nome.innerHTML = "Nome deve possuir pelo menos 4 caracteres";
        return false;
    } else {
        validacao_nome.innerHTML = "Nome válido!";
        return true;
    }
}

function validarEmail() {
    var email = email_input.value;

    if (!email.includes("@")) {
        validacao_email.innerHTML = "E-mail deve possuir @";
        return false;
    } else {
        validacao_email.innerHTML = "E-mail válido!";
        return true;
    }
}

function validarSenha() {
    var senha = senha_input.value;
    var simbolos = "!@#$%&*()-_+=";
    var temSimbolo = false;

    for (var i = 0; i < senha.length; i++) {
        if (simbolos.includes(senha[i])) {
            temSimbolo = true;
        }
    }

    if (senha.length < 8 || temSimbolo == false) {
        validacao_senha.innerHTML = "Senha precisa ter 8 caracteres e 1 símbolo especial";
        return false;
    } else {
        validacao_senha.innerHTML = "Senha válida!";
        return true;
    }
}

function validarConfirmacaoSenha() {
    var senha = senha_input.value;
    var confirmacao = confirmacao_senha_input.value;

    if (senha != confirmacao) {
        validacao_confirmacao.innerHTML = "As senhas não são iguais";
        return false;
    } else {
        validacao_confirmacao.innerHTML = "Senhas iguais!";
        return true;
    }
}
</script>
